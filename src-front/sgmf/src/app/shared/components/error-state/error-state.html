<div class="alert alert-danger mb-0" role="alert">
  <h2 class="h6 alert-heading">{{ title() }}</h2>

  <p [class.mb-0]="!actionLabel()" [class.mb-3]="actionLabel()">
    {{ message() }}
  </p>

  @if (actionLabel()) {
    <button type="button" class="btn btn-outline-danger" (click)="action.emit()">
      {{ actionLabel() }}
    </button>
  }
</div>
