<div
  class="loading-page d-flex align-items-center justify-content-center"
  role="status"
  aria-live="polite"
  aria-atomic="true"
>
  <div class="loading-page__content d-flex flex-column align-items-center gap-3 rounded-4 p-4">
    <div class="spinner-border loading-page__spinner" aria-hidden="true"></div>

    <span class="loading-page__message">
      {{ message() }}
    </span>
  </div>
</div>
