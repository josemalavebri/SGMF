<div class="container py-4">
  <div
    class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4"
  >
    <div>
      <h1 class="mb-1">Movimientos</h1>
      <p class="text-secondary mb-0">Consulta y administra tus ingresos y egresos.</p>
    </div>

    <button type="button" class="btn btn-primary" (click)="create()">Nuevo movimiento</button>
  </div>

  @if (store.loading()) {
    <app-loading-data message="Cargando movimientos..." />
  } @else if (store.error()) {
    <app-error-state
      title="No se pudieron cargar los movimientos"
      [message]="store.error()!"
      actionLabel="Reintentar"
      (action)="retry()"
    />
  } @else if (store.movimientos().length === 0) {
    <div class="card">
      <div class="card-body p-0">
        <app-empty-state
          title="No hay movimientos"
          message="Todavía no has registrado ningún movimiento."
          actionLabel="Registrar movimiento"
          (action)="create()"
        />
      </div>
    </div>
  } @else {
    <div class="card">
      <div class="card-body p-0">
        <app-movimiento-table
          [movimientos]="store.movimientos()"
          (edit)="edit($event)"
          (delete)="delete($event)"
        />
      </div>
    </div>
  }
</div>
