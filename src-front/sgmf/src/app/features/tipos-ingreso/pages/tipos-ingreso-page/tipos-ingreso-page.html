<div class="container-fluid py-4">
  <div
    class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4"
  >
    <div>
      <h1 class="h3 fw-bold mb-1">Tipos de ingreso</h1>
      <p class="text-secondary mb-0">Administra las fuentes de ingreso de tus movimientos.</p>
    </div>

    <a routerLink="crear" class="btn btn-primary">
      <i class="bi bi-plus-lg me-2" aria-hidden="true"></i>
      Nuevo tipo de ingreso
    </a>
  </div>

  @if (error) {
    <div class="alert alert-danger" role="alert">
      {{ error }}
    </div>
  }

  <div class="card border-0 shadow-sm">
    <div
      class="card-header bg-white border-bottom d-flex justify-content-between align-items-center py-3"
    >
      <h2 class="h6 fw-semibold mb-0">Listado</h2>

      @if (tipos$ | async; as tipos) {
        <span class="text-secondary small">
          {{ tipos.length }} {{ tipos.length === 1 ? 'registro' : 'registros' }}
        </span>
      }
    </div>

    @if (tipos$ | async; as tipos) {
      <app-tipo-ingreso-table
        [tipos]="tipos"
        (editar)="editar($event)"
        (eliminar)="eliminar($event)"
      />
    }
  </div>
</div>
