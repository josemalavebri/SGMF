<div class="table-responsive">
  <table class="table table-hover align-middle mb-0">
    <thead>
      <tr>
        <th scope="col">Nombre</th>
        <th scope="col">Estado</th>
        <th scope="col" class="text-end">Acciones</th>
      </tr>
    </thead>

    <tbody>
      @for (tipo of tipos; track tipo.idTipoIngreso) {
        <tr>
          <td class="fw-medium">{{ tipo.nombre }}</td>

          <td>
            @if (tipo.activo) {
              <span class="badge text-bg-success">Activo</span>
            } @else {
              <span class="badge text-bg-secondary">Inactivo</span>
            }
          </td>

          <td class="text-end">
            <div class="d-inline-flex gap-2">
              <button
                type="button"
                class="btn btn-outline-primary btn-sm"
                title="Editar tipo de ingreso"
                [attr.aria-label]="'Editar ' + tipo.nombre"
                (click)="editar.emit(tipo)"
              >
                <i class="bi bi-pencil" aria-hidden="true"></i>
                <span class="d-none d-md-inline ms-1">Editar</span>
              </button>

              <button
                type="button"
                class="btn btn-outline-danger btn-sm"
                title="Eliminar tipo de ingreso"
                [attr.aria-label]="'Eliminar ' + tipo.nombre"
                (click)="eliminar.emit(tipo)"
              >
                <i class="bi bi-trash" aria-hidden="true"></i>
                <span class="d-none d-md-inline ms-1">Eliminar</span>
              </button>
            </div>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="3" class="text-center py-5">
            <i class="bi bi-inbox fs-2 text-secondary d-block mb-2"></i>
            <p class="fw-medium mb-1">No hay tipos de ingreso</p>
            <p class="text-secondary small mb-0">Crea un tipo de ingreso para comenzar.</p>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
