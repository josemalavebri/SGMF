
<form [formGroup]="form" (ngSubmit)="enviar()" novalidate>
  @if (error) {
    <div class="alert alert-danger" role="alert">
      {{ error }}
    </div>
  }

  <div class="mb-4">
    <label for="nombre" class="form-label fw-medium">
      Nombre de la categoría
    </label>

    <input
      id="nombre"
      type="text"
      class="form-control"
      formControlName="nombre"
      placeholder="Ej. Alimentación"
      maxlength="50"
      [class.is-invalid]="
        form.controls.nombre.touched && form.controls.nombre.invalid
      "
      autocomplete="off"
    />

    @if (form.controls.nombre.touched && form.controls.nombre.hasError('required')) {
      <div class="invalid-feedback">
        El nombre es obligatorio.
      </div>
    }

    @if (form.controls.nombre.touched && form.controls.nombre.hasError('maxlength')) {
      <div class="invalid-feedback">
        El nombre no puede superar los 50 caracteres.
      </div>
    }
  </div>

  <div class="d-flex justify-content-end gap-2">
    <button
      type="button"
      class="btn btn-outline-secondary"
      [disabled]="guardando"
      (click)="cancelar.emit()"
    >
      Cancelar
    </button>

    <button
      type="submit"
      class="btn btn-primary"
      [disabled]="guardando"
    >
      @if (guardando) {
        <span
          class="spinner-border spinner-border-sm me-2"
          aria-hidden="true"
        ></span>
        Guardando...
      } @else {
        <i class="bi bi-check-lg me-2" aria-hidden="true"></i>
        Guardar
      }
    </button>
  </div>
</form>
