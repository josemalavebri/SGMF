<aside
  class="sidebar d-flex flex-column vh-100"
  [class.sidebar--collapsed]="collapsed"
  [class.sidebar--mobile-open]="mobileOpen"
>
  <div class="sidebar__brand d-flex align-items-center gap-3">
    <div class="sidebar__brand-icon d-flex align-items-center justify-content-center">
      <i class="bi bi-wallet2" aria-hidden="true"></i>
    </div>

    <div class="sidebar__brand-text">
      <span class="sidebar__brand-name">Finanzas</span>
      <span class="sidebar__brand-caption">Gestión personal</span>
    </div>
  </div>

  <nav class="sidebar__navigation flex-grow-1" aria-label="Navegación principal">
    <span class="sidebar__section-label">MENÚ PRINCIPAL</span>

    <ul class="nav flex-column gap-1">
      @for (item of items; track item.route) {
        <li class="nav-item">
          <a
            class="nav-link sidebar__link d-flex align-items-center gap-3"
            [routerLink]="item.route"
            routerLinkActive="sidebar__link--active"
            [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
            [attr.aria-label]="item.label"
          >
            <i
              class="sidebar__link-icon"
              [class]="'bi ' + item.icon + ' sidebar__link-icon'"
              aria-hidden="true"
            ></i>

            <span>{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>

  <div class="sidebar__footer">
    <div class="d-flex align-items-center gap-3">
      <div class="sidebar__footer-icon d-flex align-items-center justify-content-center">
        <i class="bi bi-shield-check" aria-hidden="true"></i>
      </div>

      <div class="sidebar__footer-text">
        <span class="sidebar__footer-title">Finanzas personales</span>
        <span class="sidebar__footer-caption">Panel de administración</span>
      </div>
    </div>
  </div>
</aside>
